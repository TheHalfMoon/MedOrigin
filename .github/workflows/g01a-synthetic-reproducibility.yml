name: G01a Synthetic Reproducibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-reproducibility:
    name: synthetic-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_NET_OFFLINE: "true"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact Git HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Gate frozen source and cargo configuration
        shell: bash
        run: |
          set -euo pipefail
          python tools/governance/g01a_synthetic_check.py --root . --json
          python -c 'import hashlib, pathlib, sys; expected="35356b0c9d5bcd70231fd6c038574ebc5951530f03c50235d4a0447049761860"; actual=hashlib.sha256(pathlib.Path("crates/g01a-synthetic/src/lib.rs").read_bytes()).hexdigest(); sys.exit(0 if actual == expected else 3)'
      - name: Install explicitly pinned development toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Format Rust
        shell: bash
        run: cargo fmt --all -- --check
      - name: Build and test without crate registry
        shell: bash
        run: cargo test --offline --locked --workspace --all-targets
      - name: Lint without crate registry
        shell: bash
        run: cargo clippy --offline --locked --workspace --all-targets -- -D warnings
      - name: Verify synthetic fixture identity and fail-closed metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/governance/g01a_synthetic_check.py --root . --json
          python -m unittest discover -s tools/governance/tests -q
